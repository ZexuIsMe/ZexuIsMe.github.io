# Writing Settings
## 自动摘要设置
excerpt_depth: 5  # 自动摘要的标题层级
auto_excerpt:
  enable: true    # 启用自动摘要
  length: 150     # 自动摘要的长度（字符数）

# Article Display
article:
  show_excerpt: true  # 在首页显示文章摘要
  show_date: true     # 显示文章日期
  show_categories: true  # 显示文章分类
  show_tags: true      # 显示文章标签
  show_copyright: true  # 显示文章版权声明
  copyright: '. 保留所有权利' # 文章版权声明文本
  copyright_subtext: '本文为原创内容，未经授权禁止转载或用于商业用途。' # 文章版权声明子文本
  link_404: '啊咧咧~，global-link 不见了！' # 用于链接跳转的全局元素不见了
  pre_link: '上一篇' # 上一篇链接文本
  next_link: '下一篇' # 下一篇链接文本


# Navigation
nav:
  - text: 首页  # 数组的第一个元素
    path: /index  # 数组的第二个元素
  - text: 碧海苍云录
    path: /bhcyl
  - text: 归档  # 数组的第一个元素
    path: /archives  # 数组的第二个元素
  - text: 关于我  # 数组的第一个元素
    path: /about  # 数组的第二个元素
index:
  latest_posts: '最新文章' # 首页最新文章标题
  read_more: '点击阅读' # 首页阅读更多按钮文本
  now_card_link_404: '啊咧咧~，链接标签不见了！' # 用于卡片的链接的元素不见了
  no_excerpt: '没有摘要，要不点进来看看吧 :）' # 首页摘要为空时显示的提示
  category_number: ' 篇文章' # 文章分类标题
  banner:
    - title: 繁花拍摄
      subtitle: 摄影、化妆老师太给力了！
      image: images/home_banner/ZC__2091.JPG
      src: about/#my-picture
    - title: 碧海苍云录
      subtitle: 一个不肝不氪，弱联网的单机休闲小游，游戏立绘方面真的直接吹爆好吧。
      image: images/home_banner/0.01.webp
      src: bhcyl
archives:
  title: '文章归档' # 归档页面标题
  no_posts_found: '暂无文章' # 归档页面暂无文章时显示的提示
  table_headers:
    - 标题
    - 分类
    - 标签
    - 创建时间
    - 更新时间
    - 操作
  check: '查看' # 查看按钮文本
  search_404: '无匹配结果' # 搜索结果为空时显示的提示
  
