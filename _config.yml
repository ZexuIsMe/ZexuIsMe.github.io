# Hexo 配置
## 文档: https://hexo.io/docs/configuration.html
## 源码: https://github.com/hexojs/hexo/

# 站点
title: Hexo
subtitle: ''
description: ''
keywords:
author: John Doe
language: en
timezone: ''

# 网址
## 在此设置你的站点网址。例如，如果你使用 GitHub Page，请将 url 设置为 'https://username.github.io/project'
url: https://zexuisme.github.io/
permalink: :year/:month/:day/:title/
permalink_defaults:
pretty_urls:
  trailing_index: true # 设置为 false 以从永久链接中删除尾随的 'index.html'
  trailing_html: true # 设置为 false 以从永久链接中删除尾随的 '.html'

# 目录
source_dir: source
public_dir: public
tag_dir: tags
archive_dir: archives
category_dir: categories
code_dir: downloads/code
i18n_dir: :lang
skip_render:

# 写作
new_post_name: :title.md # 新帖子的文件名
# 文章默认布局，默认是 post，主要是用来设置文章的默认显示方式
## 参数 post 是 layout 下的 post.ejs 文件, 只要修改它你就可以自定义文章的显示方式
default_layout: post
titlecase: false # 将标题转换为标题格式
external_link:
  enable: true # 在新标签页中打开外部链接
  field: site # 应用于整个站点
  exclude: ''
filename_case: 0
render_drafts: false
post_asset_folder: false
relative_link: false
future: true
# syntax_highlighter: highlight.js
highlight:
  line_number: false
  auto_detect: false
  tab_replace: ''
  wrap: false
  hljs: true
  enable: true
#prismjs:
#  preprocess: true
#  line_number: true
#  tab_replace: ''

# 首页设置
# path: 博客索引页面的根路径。(默认 = '')
# per_page: 每页显示的帖子数。(0 = 禁用分页)
# order_by: 帖子顺序。(默认按日期降序排列)
index_generator:
  path: ''
  per_page: 10
  order_by: -date

# 分类和标签
default_category: uncategorized
category_map:
tag_map:

# 元数据元素
## https://developer.mozilla.org/en-US/docs/Web/HTML/Element/meta
meta_generator: true

# 日期/时间格式
## Hexo 使用 Moment.js 解析和显示日期
## 你可以按照以下定义自定义日期格式
## http://momentjs.com/docs/#/displaying/format/
date_format: YYYY-MM-DD
time_format: HH:mm:ss
## updated_option 支持 'mtime', 'date', 'empty'
updated_option: 'mtime'

# 分页
## 将 per_page 设置为 0 以禁用分页
per_page: 3
pagination_dir: page


# 包含/排除文件
## include:/exclude: 选项仅适用于 'source/' 文件夹
include:
exclude:
ignore:

# 扩展
## 插件: https://hexo.io/plugins/
## 主题: https://hexo.io/themes/
#theme: landscape
theme: pixel-theme

# 部署
## 文档: https://hexo.io/docs/one-command-deployment
deploy:
  type: git
  repository: git@github.com:ZexuIsMe/ZexuIsMe.github.io.git
  branch: main2